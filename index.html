<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4d3b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Contagem do Estoque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --verde:#1d4d3b; --verde-2:#2c6b54; --gema:#f2b705; --gema-fundo:#fff3c4;
    --fundo:#eef2ec; --cartao:#ffffff; --texto:#17231d; --suave:#5d6b63;
    --linha:#d9e1da; --perigo:#b3392b;
    --titulo:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
    --corpo:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{ --fundo:#0f1a15; --cartao:#17251f; --texto:#eaf1ec; --suave:#9db0a5; --linha:#27392f; --gema-fundo:#3a3210; --verde:#123628; --verde-2:#f2b705; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;touch-action:manipulation}
  html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:var(--corpo);font-size:18px}
  body{padding-bottom:calc(92px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
  button,input{font-family:inherit}
  button{touch-action:manipulation;min-height:48px;cursor:pointer}

  header{background:var(--verde);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px}
  header h1{margin:0;font:800 26px/1.1 var(--titulo);letter-spacing:-.01em}
  .status{display:inline-flex;align-items:center;gap:7px;font-size:14px;margin-top:5px;opacity:.92}
  .status i{width:11px;height:11px;border-radius:50%;background:#e0a39a;display:inline-block}
  .status.on i{background:#7ee2a8}
  .quem{flex:none;background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;padding:0 16px;font:600 16px var(--corpo);min-height:46px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  main{padding:14px 14px 0;max-width:640px;margin:0 auto}
  .campo{width:100%;min-width:0;border:2px solid var(--linha);background:var(--cartao);color:var(--texto);border-radius:14px;padding:14px 16px;font-size:18px;outline:none}
  .campo:focus{border-color:var(--verde-2);box-shadow:0 0 0 4px rgba(44,107,84,.2)}
  .btn{border:0;border-radius:14px;padding:16px 18px;font:700 17px var(--corpo);min-height:56px}
  .btn.primario{background:var(--gema);color:#2a2100}
  .btn.verde{background:var(--verde);color:#fff}
  .btn.suave{background:transparent;color:var(--suave);border:2px solid var(--linha)}
  .btn.perigo{background:transparent;color:var(--perigo);border:2px solid var(--perigo)}
  .btn.perigoCheio{background:var(--perigo);color:#fff}
  .btn.grande{width:100%;min-height:62px;font-size:18px;margin-top:10px}
  .btn:active{transform:scale(.98)}

  /* ----- busca grande ----- */
  .busca-wrap{position:relative;margin-bottom:12px}
  .lupa{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:28px;height:28px;color:var(--verde-2);pointer-events:none}
  .busca-input{width:100%;height:72px;border:3px solid var(--verde-2);background:var(--cartao);color:var(--texto);border-radius:20px;padding:0 66px 0 58px;font:600 22px var(--corpo);outline:none;-webkit-appearance:none;appearance:none}
  .busca-input::placeholder{color:var(--suave);font-weight:500}
  .busca-input:focus{box-shadow:0 0 0 5px rgba(44,107,84,.22)}
  .busca-input::-webkit-search-cancel-button{display:none}
  .limpar{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:54px;height:54px;min-height:0;border:0;border-radius:14px;background:var(--gema-fundo);color:var(--texto);font-size:24px;display:none;padding:0}
  .limpar.mostra{display:block}

  .chips{display:flex;gap:10px;overflow-x:auto;margin:0 -14px 8px;padding:2px 14px 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:2px solid var(--linha);background:var(--cartao);color:var(--texto);border-radius:999px;padding:0 20px;min-height:52px;font:700 17px var(--corpo)}
  .chip.on{background:var(--verde);color:#fff;border-color:var(--verde)}

  .dica{color:var(--suave);font-size:17px;line-height:1.4;margin:6px 4px 14px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;text-align:left;background:var(--cartao);border:2px solid var(--linha);border-radius:20px;padding:16px;min-height:112px;color:var(--texto)}
  .tile b{font:800 21px/1.15 var(--titulo)}
  .tile span{font-size:15px;color:var(--suave)}
  .tile.largo{grid-column:1/-1;min-height:88px;background:var(--verde);border-color:var(--verde)}
  .tile.largo b,.tile.largo span{color:#fff}

  /* ----- lista ----- */
  .cont{color:var(--suave);font-size:16px;margin:4px 4px 10px}
  .grupo{font:800 14px var(--corpo);letter-spacing:.08em;text-transform:uppercase;color:var(--suave);margin:18px 4px 10px}
  .li{display:block;width:100%;text-align:left;background:var(--cartao);border:1px solid var(--linha);border-left:7px solid var(--linha);border-radius:18px;padding:14px 14px 14px 16px;margin-bottom:10px;color:var(--texto);min-height:88px}
  .li.feito{border-left-color:var(--gema)}
  .li:active{transform:scale(.99)}
  .li-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;min-height:32px}
  .cod{font:800 15px var(--titulo);color:var(--suave);background:var(--fundo);border-radius:8px;padding:3px 10px}
  .nm{display:block;font:700 19px/1.25 var(--corpo);word-break:break-word}
  .cd{display:block;font:500 14px var(--corpo);color:var(--suave);margin-top:4px}
  .tt{font:800 30px/1 var(--titulo);color:var(--verde-2)}
  .tt.zero{color:var(--suave);opacity:.45}
  .tt2{display:flex;gap:16px}
  .tt2 span{font:800 24px/1 var(--titulo);color:var(--verde-2)}
  .tt2 span.zero{color:var(--suave);opacity:.45}
  .tt2 i{font:700 12px var(--corpo);font-style:normal;color:var(--suave);margin-right:5px;letter-spacing:.04em}
  .vazio{text-align:center;color:var(--suave);padding:30px 16px 8px;line-height:1.5;font-size:18px}

  /* ----- totais ----- */
  .resumo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 2px 12px;color:var(--suave);font-size:16px}
  .tl{background:var(--cartao);border:1px solid var(--linha);border-radius:16px;padding:12px 14px;margin-bottom:8px}
  .tl .v{font:800 22px var(--titulo);color:var(--verde-2)}
  .tl .nm{font-size:17px}
  .acoes{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .acoes .btn{flex:1;min-width:0}

  /* ----- histórico ----- */
  .hist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--cartao);border:1px solid var(--linha);border-radius:16px;margin-bottom:10px}
  .hist .l{min-width:0}
  .hist .l b{display:block;font:700 17px/1.25 var(--corpo);word-break:break-word}
  .hist .l small{color:var(--suave);font-size:14px;line-height:1.35;display:block;margin-top:3px}
  .hist .q{font:800 24px var(--titulo);color:var(--verde-2);white-space:nowrap}
  .hist button{border:2px solid var(--linha);background:transparent;color:var(--perigo);border-radius:12px;padding:0 14px;font:700 15px var(--corpo);min-height:48px}

  nav{position:fixed;left:0;right:0;bottom:0;background:var(--cartao);border-top:1px solid var(--linha);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
  nav button{flex:1;border:0;background:none;padding:10px 4px 8px;color:var(--suave);font:700 14px var(--corpo);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:70px}
  nav button svg{width:28px;height:28px}
  nav button.ativo{color:var(--verde-2);box-shadow:inset 0 4px 0 var(--gema)}
  .aba{display:none}.aba.ativa{display:block}

  #toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:#17231d;color:#fff;padding:14px 20px;border-radius:14px;font-size:17px;opacity:0;pointer-events:none;transition:.25s;z-index:60;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  #toast.mostra{opacity:1;transform:translate(-50%,0)}
  #aviso{display:none;background:#fde8e4;color:#7a1f14;padding:14px 16px;border-radius:14px;margin-bottom:12px;font-size:16px;line-height:1.45}

  /* ----- tela de contagem do item ----- */
  #folha{position:fixed;inset:0;background:var(--fundo);z-index:40;display:none;flex-direction:column}
  #folha.aberta{display:flex;animation:sobe .2s ease-out}
  @keyframes sobe{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .f-topo{background:var(--verde);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 12px 14px 16px;display:flex;gap:10px;align-items:flex-start}
  .f-topo .t{flex:1;min-width:0}
  .f-topo small{display:block;opacity:.88;font-size:14px;margin-bottom:3px}
  .f-topo h2{margin:0;font:800 22px/1.2 var(--titulo);word-break:break-word}
  .f-topo .x{flex:none;width:54px;height:54px;border:0;border-radius:14px;background:rgba(255,255,255,.18);color:#fff;font-size:26px;line-height:1;padding:0}
  .f-corpo{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
  .f-rodape{background:var(--cartao);border-top:1px solid var(--linha);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px}
  .f-tot{flex:none;min-width:104px}
  .f-tot small{display:block;color:var(--suave);font-size:14px}
  .f-tot b{font:800 34px/1.05 var(--titulo);color:var(--verde-2)}
  .f-rodape .btn{flex:1;font-size:20px;padding:0 12px;min-height:66px}
  .f-rodape .btn:disabled{opacity:.4}

  .abas-campo{display:flex;gap:10px;margin-bottom:14px}
  .abas-campo button{flex:1;border:2px solid var(--linha);background:var(--cartao);color:var(--texto);border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;font:800 19px var(--corpo);min-height:70px}
  .abas-campo button small{font:600 14px var(--corpo);color:var(--suave)}
  .abas-campo button.on{background:var(--verde);border-color:var(--verde);color:#fff}
  .abas-campo button.on small{color:rgba(255,255,255,.88)}
  .atual{display:flex;justify-content:space-between;align-items:baseline;background:var(--gema-fundo);border-radius:16px;padding:14px 16px;margin-bottom:14px;font-size:17px;color:var(--texto)}
  .atual b{font:800 32px var(--titulo)}

  .lin{background:var(--cartao);border:1px solid var(--linha);border-radius:18px;padding:14px;margin-bottom:12px}
  .lin-t{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .lin-t b{font:800 21px/1.2 var(--titulo)}
  .lin-t small{display:block;color:var(--suave);font:500 15px/1.3 var(--corpo);margin-top:3px}
  .lin-sub{font:800 22px var(--titulo);color:var(--verde-2);white-space:nowrap}
  .lin-sub.zero{color:var(--suave);opacity:.45}
  .step{display:grid;grid-template-columns:68px 1fr 68px;gap:10px;margin-top:12px}
  .step button{border:2px solid var(--linha);background:var(--gema-fundo);color:var(--texto);border-radius:16px;font:700 36px var(--corpo);min-height:66px;padding:0}
  .step input{text-align:center;font:800 32px var(--titulo);padding:8px 4px;min-height:66px}
  .livre{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:12px}
  .livre .mult{font:700 26px var(--titulo);color:var(--suave)}
  .livre input{text-align:center;font:800 28px var(--titulo);min-height:66px;padding:8px 4px}
  .f-links{display:flex;gap:18px;margin:20px 2px 8px}
  .f-links button{background:none;border:0;color:var(--suave);font:500 16px var(--corpo);text-decoration:underline;min-height:48px}

  /* ----- janelas de pergunta ----- */
  #modal{position:fixed;inset:0;background:rgba(10,20,15,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  #modal.aberto{display:flex}
  #modal .caixa{background:var(--cartao);color:var(--texto);border-radius:22px;padding:22px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  #modal h2{margin:0 0 10px;font:800 24px/1.2 var(--titulo)}
  #modal p{margin:0 0 16px;color:var(--suave);line-height:1.45;font-size:17px}
  #modal .campo{margin-bottom:16px;font-size:20px}
  #modal .mbtns{display:flex;gap:12px}
  #modal .mbtns .btn{flex:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div>
    <h1>Contagem</h1>
    <span class="status" id="status"><i></i><span id="statusTxt">Conectando…</span></span>
  </div>
  <button class="quem" id="btnQuem">Quem está contando?</button>
</header>

<main>
  <div id="aviso"></div>

  <!-- CONTAR -->
  <section class="aba ativa" id="aba-contar">
    <div class="busca-wrap">
      <svg class="lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="busca" class="busca-input" type="search" inputmode="search" enterkeyhint="search" placeholder="Buscar item…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="limpar" id="limpar" aria-label="Limpar busca">✕</button>
    </div>
    <div class="chips" id="chips" style="display:none"></div>
    <div id="lista"></div>
  </section>

  <!-- TOTAIS -->
  <section class="aba" id="aba-totais">
    <div class="resumo"><span id="resumoTxt"></span><button class="chip" id="btnSoContados"></button></div>
    <div id="totais"></div>
    <div class="acoes">
      <button class="btn verde grande" id="btnPDF">Baixar contagem (PDF)</button>
    </div>
    <div class="acoes">
      <button class="btn suave" id="btnCopiar">Copiar texto</button>
      <button class="btn perigo" id="btnZerar">Zerar tudo</button>
    </div>
  </section>

  <!-- HISTÓRICO -->
  <section class="aba" id="aba-hist">
    <div class="resumo"><span>Últimas 100 contagens. Toque em Desfazer para corrigir um erro.</span></div>
    <div id="hist"></div>
  </section>
</main>

<nav>
  <button class="ativo" data-aba="contar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Contar
  </button>
  <button data-aba="totais">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Totais
  </button>
  <button data-aba="hist">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Histórico
  </button>
</nav>

<!-- tela de contagem de um item -->
<div id="folha" role="dialog" aria-modal="true">
  <div class="f-topo">
    <div class="t"><small id="fCod"></small><h2 id="fTitulo"></h2></div>
    <button class="x" id="fFechar" aria-label="Fechar">✕</button>
  </div>
  <div class="f-corpo" id="fCorpo"></div>
  <div class="f-rodape">
    <div class="f-tot"><small>Esta contagem</small><b id="fTot">0</b></div>
    <button class="btn primario" id="fSomar" disabled>Somar ao total</button>
  </div>
</div>

<div id="toast"></div>
<div id="modal"></div>

<script>
/* Se o celular mostrar a página como "site de computador" (largura ~1000px), reduz o layout para a largura real da tela */
(function(){
  function ajusta(){
    var sw = screen.width, iw = window.innerWidth;
    var z = (sw && sw < 600 && iw > sw * 1.25) ? iw / Math.max(sw, 360) : 1;
    document.documentElement.style.zoom = z > 1 ? z : "";
  }
  ajusta(); window.addEventListener("resize", ajusta);
})();

}

/* ---------- diálogo ---------- */
function dialogo({ titulo, texto = "", campo = false, valor = "", ok = "OK", perigo = false }){
  return new Promise(resolve => {
    const el = $("#modal");
    el.innerHTML = `<div class="caixa" role="dialog" aria-modal="true">
      <h2>${esc(titulo)}</h2>
      ${texto ? `<p>${esc(texto).replace(/\n/g, "<br>")}</p>` : ""}
      ${campo ? `<input class="campo" id="mCampo" value="${esc(valor)}" autocomplete="off">` : ""}
      <div class="mbtns">
        <button class="btn suave" data-r="0">Cancelar</button>
        <button class="btn ${perigo ? "perigoCheio" : "verde"}" data-r="1">${esc(ok)}</button>
      </div></div>`;
    el.classList.add("aberto");
    const inp = $("#mCampo");
    if(inp) setTimeout(() => { inp.focus(); inp.select(); }, 60);
    const fechar = (v) => { el.classList.remove("aberto"); el.innerHTML = ""; resolve(v); };
    el.onclick = (e) => {
      if(e.target === el) return fechar(null);
      const b = e.target.closest("button"); if(!b) return;
      if(b.dataset.r !== "1") return fechar(null);
      fechar(campo ? inp.value : true);
    };
    if(inp) inp.onkeydown = (e) => { if(e.key === "Enter") fechar(inp.value); };
  });
}

function montaItens(){

      campos:[{ id:"q", rotulo:"Quantidade", linhas:[] }], unid:"unidades"
    }))
    .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR", { sensitivity:"base" }));

}

function itensVisiveis(somenteContados){
  const tokens = norm(state.busca.trim()).split(/\s+/).filter(Boolean);
  return state.itens.filter(i => {
    if(state.filtro !== "" && state.filtro !== "todos" && i.cat !== state.filtro) return false;
    if(somenteContados && !feito(i)) return false;
    const alvo = norm(i.cod + " " + i.nome + " " + i.grupo + " " + (i.mapa || ""));
    return tokens.every(t => alvo.includes(t));
  });
}

  const a = totalDe(i, i.campos[0].id), b = totalDe(i, i.campos[1].id);
  return `<span class="tt2"><span class="${a ? "" : "zero"}"><i>CX</i>${fmt(a)}</span><span class="${b ? "" : "zero"}"><i>BDJ</i>${fmt(b)}</span></span>`;
}

/* =====================================================================
   TELA DE CONTAGEM DO ITEM
   ===================================================================== */
function linhasDe(campo, item){
  const ls = campo.linhas.slice();
  if(!ls.some(l => l.f === 1)) ls.push(L(cap(item.unid || "unidades") + " soltas", "contagem direta", 1));
  return ls;
}
function rascDe(campoId){ return folha.rasc[campoId] || (folha.rasc[campoId] = { v:{}, a:"", b:"" }); }
function campoAtual(it){ return it.campos.find(c => c.id === folha.campo) || it.campos[0]; }

function calcular(it, campo){
  const d = rascDe(campo.id);
  let total = 0; const partes = [];
  linhasDe(campo, it).forEach((l, k) => {
    const q = num(d.v[k]);
    if(q){ total += q * l.f; partes.push(l.f === 1 ? String(q) : `${q}×${l.f}`); }
  });
  const a = num(d.a), b = num(d.b);
  if(a && b){ total += a * b; partes.push(`${a}×${b}`); }
  return { total, detalhe: partes.join(" + ") };
}

function abrirFolha(id){
  const it = itemPorId(id); if(!it) return;
  folha.id = id; folha.campo = it.campos[0].id; folha.rasc = {};
  renderFolha();
  $("#folha").classList.add("aberta");
  $("#fCorpo").scrollTop = 0;
  history.pushState({ folha:true }, "");
}
function fecharFolha(viaPop){
  if(!folha.id) return;
  $("#folha").classList.remove("aberta");
  folha.id = null; folha.rasc = {};
  if(!viaPop && history.state && history.state.folha) history.back();
}
window.addEventListener("popstate", () => { if(folha.id) fecharFolha(true); });

function renderFolha(){
  const it = itemPorId(folha.id); if(!it){ fecharFolha(); return; }
  const campo = campoAtual(it); folha.campo = campo.id;
  const d = rascDe(campo.id);
  $("#fCod").textContent = [it.cod ? "Código " + it.cod : it.grupo, it.mapa ? "Mapa: " + it.mapa : ""].filter(Boolean).join(" · ");
  $("#fTitulo").textContent = it.nome;

  let html = "";
  if(it.campos.length > 1){
    html += `<div class="abas-campo">` + it.campos.map(c =>
      `<button data-campo="${c.id}" class="${c.id === campo.id ? "on" : ""}">${esc(c.rotulo)}<small data-tab-total="${c.id}">${fmt(totalDe(it, c.id))} contados</small></button>`
    ).join("") + `</div>`;
  }
  html += `<div class="atual"><span>Já contado${it.campos.length > 1 ? " em " + esc(campo.rotulo) : ""}</span><b id="fAtual">${fmt(totalDe(it, campo.id))}</b></div>`;

  linhasDe(campo, it).forEach((l, k) => {
    html += `<div class="lin" data-k="${k}">
      <div class="lin-t"><div><b>${esc(l.r)}</b><small>${esc(l.f === 1 ? l.d : l.d + " · × " + fmt(l.f))}</small></div><div class="lin-sub zero" data-sub>—</div></div>
      <div class="step">
        <button data-passo="-1" aria-label="Menos um">−</button>
        <input class="campo" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" data-q value="${esc(d.v[k] ?? "")}">
        <button data-passo="1" aria-label="Mais um">+</button>
      </div>
    </div>`;
  });

  html += `<div class="lin">
    <div class="lin-t"><div><b>Outra conta</b><small>quantidade × quanto tem em cada (ex.: 5 paletes × 56 caixas)</small></div><div class="lin-sub zero" data-sub-livre>—</div></div>
    <div class="livre">
      <input class="campo" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Qtd" data-livre="a" value="${esc(d.a)}">
      <span class="mult">×</span>
      <input class="campo" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Cada" data-livre="b" value="${esc(d.b)}">
    </div>
  </div>`;

  if(it.custom) html += `<div class="f-links"><button data-renomear>Renomear item</button><button data-excluir>Excluir item</button></div>`;
  $("#fCorpo").innerHTML = html;
  atualizaCalc();
}

function atualizaCalc(){
  const it = itemPorId(folha.id); if(!it) return;
  const campo = campoAtual(it), d = rascDe(campo.id), ls = linhasDe(campo, it);
  document.querySelectorAll("#fCorpo .lin[data-k]").forEach(el => {
    const k = +el.dataset.k, q = num(d.v[k]), s = el.querySelector("[data-sub]");
    s.textContent = q ? "= " + fmt(q * ls[k].f) : "—";
    s.classList.toggle("zero", !q);
  });
  const a = num(d.a), b = num(d.b), sl = $("#fCorpo [data-sub-livre]");
  if(sl){ sl.textContent = a && b ? "= " + fmt(a * b) : "—"; sl.classList.toggle("zero", !(a && b)); }
  const { total } = calcular(it, campo);
  $("#fTot").textContent = fmt(total);
  $("#fSomar").disabled = !total;
}
function atualizaFolhaTotais(){
  const it = itemPorId(folha.id); if(!it) return;
  const campo = campoAtual(it);
  const f = $("#fAtual"); if(f) f.textContent = fmt(totalDe(it, campo.id));
  document.querySelectorAll("[data-tab-total]").forEach(el => { el.textContent = fmt(totalDe(it, el.dataset.tabTotal)) + " contados"; });
}

async function somarFolha(){
  const it = itemPorId(folha.id); if(!it) return;
  const campo = campoAtual(it);
  const { total, detalhe } = calcular(it, campo);
  if(!total){ toast("Preencha alguma quantidade"); return; }
  const batch = writeBatch(db);
  batch.set(doc(itensRef, it.id), { totais:{ [campo.id]: increment(total) } }, { merge:true });
  batch.set(doc(contRef), {
    itemId:it.id, itemNome:it.nome, cod:it.cod, campo:campo.id,
    campoRotulo: it.campos.length > 1 ? campo.rotulo : "",
    qtd:total, detalhe, contador:quem(), ts:serverTimestamp()
  });
  delete folha.rasc[campo.id];
  renderFolha();
  if(navigator.vibrate) navigator.vibrate(30);
  toast(`+${fmt(total)} somados`);
  try{ await batch.commit(); }catch(e){ erro(e); }
}

/* eventos da tela de contagem */
$("#fCorpo").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if(!b) return;
  const it = itemPorId(folha.id); if(!it) return;
  if(b.dataset.campo){ folha.campo = b.dataset.campo; renderFolha(); return; }
  if(b.dataset.passo){
    const lin = b.closest(".lin"), k = +lin.dataset.k, inp = lin.querySelector("input");
    const novo = Math.max(0, num(inp.value) + num(b.dataset.passo));
    inp.value = novo || "";
    rascDe(folha.campo).v[k] = inp.value;
    atualizaCalc(); return;
  }
  if(b.hasAttribute("data-renomear")) renomear(it.id);
  if(b.hasAttribute("data-excluir")) excluir(it.id);
});
$("#fCorpo").addEventListener("input", (e) => {
  const t = e.target; if(t.tagName !== "INPUT") return;
  t.value = t.value.replace(/\D/g, "").slice(0, 9);
  const d = rascDe(folha.campo);
  if(t.dataset.livre) d[t.dataset.livre] = t.value;
  else d.v[+t.closest(".lin").dataset.k] = t.value;
  atualizaCalc();
});
$("#fCorpo").addEventListener("focusin", (e) => { if(e.target.tagName === "INPUT") setTimeout(() => e.target.select(), 0); });
$("#fSomar").addEventListener("click", somarFolha);
$("#fFechar").addEventListener("click", () => fecharFolha(false));

async function novoItem(sugestao = ""){
  const nome = ((await dialogo({ titulo:"Novo item", texto:"Para algo que não está na lista.", campo:true, valor:sugestao, ok:"Criar" })) || "").trim();
  if(!nome) return;
  if(state.itens.some(i => norm(i.nome) === norm(nome))){ toast("Esse item já existe"); return; }
  try{
    const batch = writeBatch(db);
    batch.set(doc(itensRef), { nome, custom:true, totais:{}, criadoEm:serverTimestamp() });
    await batch.commit();
    state.busca = ""; $("#busca").value = ""; atualizaBusca();
    state.filtro = "novos"; renderChips(); renderLista();
    toast("Item criado");
  }catch(e){ erro(e); }
}

async function renomear(id){
  const it = itemPorId(id);
  const nome = ((await dialogo({ titulo:"Renomear item", campo:true, valor:it.nome, ok:"Salvar" })) || "").trim();
  if(!nome || nome === it.nome) return;
  try{
    const batch = writeBatch(db);
    batch.set(doc(itensRef, id), { nome }, { merge:true });
    await batch.commit();
    $("#fTitulo").textContent = nome;
    toast("Nome alterado");
  }catch(e){ erro(e); }
}

async function apagarLotes(snap){
  for(let i = 0; i < snap.docs.length; i += 400){
    const b = writeBatch(db);
    snap.docs.slice(i, i + 400).forEach(d => b.delete(d.ref));
    await b.commit();
  }
}
async function excluir(id){
  const it = itemPorId(id);
  if(!await dialogo({ titulo:"Excluir item?", texto:`“${it.nome}” e todo o histórico dele serão apagados.\nTotal atual: ${fmt(totalDe(it, "q"))}`, ok:"Excluir", perigo:true })) return;
  try{
    fecharFolha(false);
    await apagarLotes(await getDocs(query(contRef, where("itemId","==",id))));
    const b = writeBatch(db); b.delete(doc(itensRef, id)); await b.commit();
    toast("Item excluído");
  }catch(e){ erro(e); }
}

async function desfazer(cid){
  const c = state.hist.find(x => x.id === cid); if(!c) return;
  if(!await dialogo({ titulo:"Desfazer contagem?", texto:`Tirar +${fmt(c.qtd)} de “${c.itemNome}”.`, ok:"Desfazer", perigo:true })) return;
  try{
    const b = writeBatch(db);
    b.delete(doc(contRef, cid));
    b.set(doc(itensRef, c.itemId), { totais:{ [c.campo || "q"]: increment(-c.qtd) } }, { merge:true });
    await b.commit();
    toast("Contagem desfeita");
  }catch(e){ erro(e); }
}

async function zerarTudo(){
  if(!await dialogo({ titulo:"Zerar tudo?", texto:"Todos os totais voltam a zero e o histórico é apagado.\nUse só ao começar uma nova contagem.", ok:"Continuar", perigo:true })) return;
  if(!await dialogo({ titulo:"Tem certeza?", texto:"Isso não pode ser desfeito.", ok:"Sim, zerar", perigo:true })) return;
  try{
    const docs = await getDocs(itensRef);
    for(let i = 0; i < docs.docs.length; i += 400){
      const b = writeBatch(db);
      docs.docs.slice(i, i + 400).forEach(d => b.update(d.ref, { totais:{}, total:0 }));
      await b.commit();
    }
    await apagarLotes(await getDocs(contRef));
    toast("Contagem zerada");
  }catch(e){ erro(e); }
}

async function copiarTotais(){
  const itens = state.itens.filter(i => !state.soContados || feito(i));
  if(!itens.length){ toast("Nada para copiar"); return; }
  let txt = `Contagem ${new Date().toLocaleDateString("pt-BR")}\n`, g = "";
  itens.forEach(i => {
    if(i.grupo !== g){ g = i.grupo; txt += `\n${g}\n`; }
    txt += `${i.cod ? i.cod + " - " : ""}${i.nome}: ${valoresTexto(i)}\n`;
  });
  try{ await navigator.clipboard.writeText(txt); toast("Totais copiados"); }
  catch{ await dialogo({ titulo:"Copie o texto", campo:true, valor:txt, ok:"Fechar" }); }
}

const pdfNum = (n) => new Intl.NumberFormat("pt-BR").format(n);

/* Preenche o PDF modelo do inventário com os totais contados (mesmo layout do original) */
async function preencherPdf(PDFLib, modelo, d){
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdf = await PDFDocument.load(modelo);
  const negrito = await pdf.embedFont(StandardFonts.HelveticaBold);
  const normal = await pdf.embedFont(StandardFonts.Helvetica);
  const [p1, p2] = pdf.getPages();
  const tinta = rgb(0.04, 0.18, 0.5);
  const limpa = (t) => String(t).replace(/[^\x20-\x7E\u00A1-\u00FF]/g, "");
  const centro = (pg, txt, cx, yc, tam = 10, fonte = negrito) => {
    txt = limpa(txt);
    const w = fonte.widthOfTextAtSize(txt, tam);
    pg.drawText(txt, { x: cx - w / 2, y: yc - tam * 0.35, size: tam, font: fonte, color: tinta });
  };

  // data
  const dt = d.data, dd = PDF_POS.data;
  centro(p1, String(dt.getDate()).padStart(2, "0"), dd.dia, dd.y, 9);
  centro(p1, String(dt.getMonth() + 1).padStart(2, "0"), dd.mes, dd.y, 9);
  p1.drawText(String(dt.getFullYear()), { x: dd.ano, y: dd.y - 3.1, size: 9, font: negrito, color: tinta });

  // totais
  const extras = [];
  d.itens.forEach(it => {
    const y = it.pagina === 1 ? PDF_POS.p1[it.chave] : it.pagina === 2 ? PDF_POS.p2[it.chave] : undefined;
    if(y === undefined){ if(it.cx || it.bdj || it.q) extras.push(it); return; }
    if(it.pagina === 1){
      if(it.cx) centro(p1, pdfNum(it.cx), PDF_POS.colCx, y);
      if(it.bdj) centro(p1, pdfNum(it.bdj), PDF_POS.colBdj, y);
    }else if(it.q){
      centro(p2, pdfNum(it.q), PDF_POS.colQ, y);
    }
  });

  // responsáveis pela contagem (campo "Nome:")
  const nomes = d.nomes.slice();
  PDF_POS.nomesY.forEach((y, k) => {
    if(!nomes.length) return;
    let txt = nomes[k];
    if(k === PDF_POS.nomesY.length - 1 && nomes.length > PDF_POS.nomesY.length) txt = nomes.slice(k).join(", ");
    if(txt === undefined) return;
    txt = limpa(txt);
    while(txt.length > 3 && normal.widthOfTextAtSize(txt, 9) > 168) txt = txt.slice(0, -2) + "…".replace("…", ".");
    p2.drawText(txt, { x: PDF_POS.nomeX, y: y - 3.1, size: 9, font: normal, color: tinta });
  });

  // itens que não existem no formulário (ex.: Estojo 18 ovos, itens novos):
  // primeiro usam as linhas em branco do fim da tabela da página 2
  const simples = extras.filter(e => !e.cx && !e.bdj);
  const sobras = extras.filter(e => e.cx || e.bdj);
  simples.slice(0, PDF_POS.livresP2.length).forEach((it, k) => {
    const y = PDF_POS.livresP2[k];
    let nm = limpa(it.nome);
    while(nm.length > 3 && negrito.widthOfTextAtSize(nm, 8) > 205) nm = nm.slice(0, -2);
    p2.drawText(nm, { x: PDF_POS.tipoX, y: y - 2.8, size: 8, font: negrito, color: tinta });
    centro(p2, pdfNum(it.q), PDF_POS.colQ, y);
  });
  sobras.push(...simples.slice(PDF_POS.livresP2.length));
  extras.length = 0; extras.push(...sobras);

  // o que ainda sobrar vai para uma página extra, no mesmo estilo
  if(extras.length){
    const W = 595.2, Hh = 841.68;
    let pg = null, y = 0;
    const nova = () => {
      pg = pdf.addPage([W, Hh]);
      pg.drawText("COOPERATIVA AGRÍCOLA MISTA DE VÁRZEA ALEGRE", { x: 40, y: Hh - 60, size: 12, font: negrito, color: rgb(0, 0, 0) });
      pg.drawText("INVENTÁRIO CENTRAL - ITENS CONTADOS FORA DO FORMULÁRIO", { x: 40, y: Hh - 80, size: 10, font: negrito, color: rgb(0, 0, 0) });
      pg.drawText("Data: " + dt.toLocaleDateString("pt-BR"), { x: 40, y: Hh - 96, size: 9, font: normal, color: rgb(0, 0, 0) });
      pg.drawRectangle({ x: 40, y: Hh - 128, width: W - 80, height: 20, color: rgb(0.85, 0.85, 0.85), borderColor: rgb(0, 0, 0), borderWidth: 0.8 });
      pg.drawText("DESCRIÇÃO", { x: 48, y: Hh - 122, size: 9, font: negrito });
      pg.drawText("QUANTIDADE", { x: W - 40 - 95, y: Hh - 122, size: 9, font: negrito });
      y = Hh - 128;
    };
    nova();
    extras.forEach(it => {
      if(y < 70) nova();
      y -= 22;
      pg.drawRectangle({ x: 40, y, width: W - 80, height: 22, borderColor: rgb(0, 0, 0), borderWidth: 0.6 });
      let nm = limpa(it.nome);
      while(nm.length > 3 && normal.widthOfTextAtSize(nm, 10) > 360) nm = nm.slice(0, -2);
      pg.drawText(nm, { x: 48, y: y + 7, size: 10, font: normal });
      const q = it.cx || it.bdj
        ? [it.cx ? pdfNum(it.cx) + " cx" : "", it.bdj ? pdfNum(it.bdj) + " bdj/est" : ""].filter(Boolean).join(" / ")
        : pdfNum(it.q) + (it.unid ? " " + it.unid : "");
      const w = negrito.widthOfTextAtSize(limpa(q), 10);
      pg.drawText(limpa(q), { x: W - 48 - w, y: y + 7, size: 10, font: negrito, color: tinta });
    });
  }
  return await pdf.save();
}

function carregaScript(src){
  return new Promise((ok, falha) => {
    const el = document.createElement("script");
    el.src = src; el.onload = ok;
    el.onerror = () => falha(new Error("sem internet para carregar o gerador de PDF"));
    document.head.appendChild(el);
  });
}
async function baixarPDF(){
  const b = $("#btnPDF"), rotulo = b.textContent;
  b.disabled = true; b.textContent = "Gerando PDF…";
  try{
    if(!window.PDFLib) await carregaScript("https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js");
    const snap = await getDocs(contRef);
    const nomes = [...new Set(snap.docs.map(d => String(d.data().contador || "").trim()).filter(Boolean))]
      .sort((a, c) => a.localeCompare(c, "pt-BR", { sensitivity:"base" }));
    const itens = state.itens.map(i => ({
      nome:i.nome, unid:i.unid || "",
      pagina: i.cat === "emb" ? 2 : (i.cat === "novos" ? 0 : 1),
      chave: i.id === "ovTrinc" ? "TRC" : i.cod,
      cx:  i.campos.length > 1 ? totalDe(i, "cx")  : 0,
      bdj: i.campos.length > 1 ? totalDe(i, "bdj") : 0,
      q:   i.campos.length === 1 ? totalDe(i, "q") : 0
    }));
    const modelo = Uint8Array.from(atob($("#modeloPdf").textContent.trim()), c => c.charCodeAt(0));
    const hoje = new Date();
    const bytes = await preencherPdf(window.PDFLib, modelo, { data:hoje, nomes, itens });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([bytes], { type:"application/pdf" }));
    a.download = "contagem-" + hoje.getFullYear() + "-" + String(hoje.getMonth() + 1).padStart(2, "0") + "-" + String(hoje.getDate()).padStart(2, "0") + ".pdf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 20000);
    toast("PDF gerado");
  }catch(e){
    console.error(e);
    toast("Não foi possível gerar o PDF: " + (e.message || e));
  }finally{
    b.disabled = false; b.textContent = rotulo;
  }
}
